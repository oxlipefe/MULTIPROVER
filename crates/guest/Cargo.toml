[package]
name = "repo-b-guest"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
repo-b-common.workspace = true
repo-b-evm.workspace = true
repo-b-witness.workspace = true
alloy-rlp.workspace = true
# **La recuperación ECDSA, adentro del guest.** Mismo crate y misma versión que
# el precompile ECRECOVER del motor (2.8a): un guest con DOS implementaciones de
# secp256k1 sería un guest donde dos reglas del mismo protocolo pueden discrepar.
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa"] }
# El trait del lado **guest** de `ere`, adoptado y no calcado.
# Cero dependencias: es un trait más las
# declaraciones `extern "C"` del ABI de `zkvm-standards`. Calcar un trait cuyo
# propósito es que OTROS lo implementen del otro lado deja la firma sin los tres
# implementadores.
#
# Dep `git` pineada por TAG y habilitada explícitamente en `deny.toml`
# (`allow-git`): `ere` no está en crates.io, así que la puerta de supply-chain
# se abre a mano y queda revisable.
ere-platform-core = { git = "https://github.com/eth-act/ere.git", tag = "v0.16.2" }

[dev-dependencies]
# Solo para los tests: armar a mano el trie de un pre-state mínimo. Es LA MISMA
# implementación de MPT que el witness usa para verificarlo, así que el nodo del
# test no puede tener un formato que solo este lado entienda. No entra al ELF.
alloy-trie = { workspace = true, default-features = false }

[lints.rust]
# **Excepción al `forbid` del workspace, y la única del repo.**
#
# Un binario bare-metal necesita dos cosas que no se pueden escribir en Rust
# seguro: un `#[global_allocator]` (`GlobalAlloc` es un trait `unsafe`) y un
# símbolo `_start` sin manglear. `forbid` no se puede levantar con un `allow`
# localizado —es absoluto—, así que este crate baja a `deny` y marca las DOS
# excepciones a mano, cada una con su razón escrita al lado.
#
# El resto del motor sigue bajo el `forbid` del workspace: esta puerta se abre
# en el crate más chico y más reemplazable del árbol, no en el que ejecuta la
# EVM.
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
match_same_arms = "warn"
implicit_clone = "warn"
cloned_instead_of_copied = "warn"
