# El guest **concreto** de OpenVM: la cáscara que nombra el backend.
#
# POR QUÉ ES UN CRATE HOJA Y NO UNA FEATURE DE `repo-b-guest`
#
# Por la misma razón que el de SP1: no hay un ELF para todos los backends. El
# binario nombra su backend por construcción —acá `ere-platform-openvm` trae el
# arranque y el ABI de entrada/salida de OpenVM— y lo agnóstico es la LÓGICA,
# que vive entera en `repo_b_guest::entry` y es genérica sobre `Platform`. Cada
# backend es un archivo de tres líneas.
#
# POR QUÉ NO ES MIEMBRO DEL WORKSPACE
#
# Tiene su propio `[workspace]` a propósito. Si fuera miembro, un
# `cargo build --workspace` en la máquina de desarrollo arrastraría el SDK
# entero de OpenVM al grafo del motor — la misma cuarentena que aísla al de
# SP1. El motor no puede importar un backend ni por accidente, porque ningún
# backend está en su grafo.
#
# Se compila SOLO con el toolchain de OpenVM (adentro de su imagen de Docker,
# vía `ere`), nunca con el `cargo` del host.
[workspace]

[package]
name = "repo-b-guest-openvm"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
# EL PROVIDER ACELERADO EXISTE Y NO SE ACTIVA — MEDIDO, NO ELEGIDO
#
# `repo-b-evm/crypto-openvm` está implementado y bindea los 14 símbolos que el
# estándar de aceleradores expone. **Su matemática es distinta de la de la
# referencia** (`openvm_pairing`/`openvm_k256` sobre intrínsecas RISC-V en vez
# de arkworks), que es exactamente lo que el multiproof necesita: dos backends
# con el mismo `arkworks` comparten modo de falla y un bug suyo saldría idéntico
# en las dos pruebas.
#
# No se activa porque **el KAT lo caza en rojo**: con el provider puesto,
# `zkvm_secp256k1_ecrecover` de OpenVM v2.1.0-preview no falla — TIENE ÉXITO y
# devuelve una clave pública equivocada, en silencio. Un guest así derivaría
# remitentes que nadie firmó y publicaría una prueba válida de ese bloque.
#
# Que el defecto es del backend y no del binding lo separan dos casos del KAT:
# SHA-256 y RIPEMD-160 cruzan la MISMA maquinaria FFI y salen verdes con su
# respuesta conocida, mientras la recuperación falla. Es el segundo defecto
# independiente que este backend acumula sobre secp256k1.
repo-b-guest = { path = "../guest", features = ["crypto-reference"] }
# `std` habilita el arranque automático de OpenVM: con esa feature el
# entrypoint se linkea solo y el guest es un `fn main()` normal; sin ella haría
# falta `#![no_main]` + `openvm::entry!`. Se toma la forma que el propio `ere`
# ejercita para este backend, que es la única que su pipeline de compilación
# tiene probada.
ere-platform-openvm = { git = "https://github.com/eth-act/ere.git", tag = "v0.16.2", features = ["std"] }

[profile.release]
# CUARENTENA — ESTE PERFIL ESTÁ DESOPTIMIZADO A PROPÓSITO Y ES TEMPORAL
#
# El de SP1 dice "el guest se paga en ciclos, no en tiempo de compilación", que
# es la regla del proyecto. Acá está al revés, y no por preferencia: **OpenVM
# v2.1.0-preview miscompila su propio camino optimizado.**
#
# QUÉ PASA SI SE SUBE
#
# La división de enteros grandes de `ruint` devuelve resultados corruptos cuando
# el divisor tiene el bit más alto prendido. `(p-1)^2 mod p` sobre el primo de
# secp256k1 tiene que dar los limbos [1,0,0,0] y da [1, 2^256-p, p0, p1]: el
# limbo bajo correcto y encima palabras derivadas del propio módulo. Rompe
# secp256k1 (bit 255 prendido) y NO rompe bn254 (leading_zeros = 2), así que el
# daño es silencioso y dependiente del valor. Aguas abajo muere ECRECOVER y el
# guest no deriva ningún sender.
#
# POR QUÉ ESTAS TRES LÍNEAS Y NO OTRAS — MEDIDO, NO ELEGIDO
#
#   opt-level  debug-assertions   división   mul_mod   ECDSA
#      3            false            no         no       no
#      3            true            SÍ          no       no
#      2            true             no         no       no
#      1            true            SÍ         SÍ        no
#      0            true            SÍ         SÍ       SÍ
#
# `debug-assertions` cambia SOLO dos cosas en `ruint`: `assume!` pasa de
# `unreachable_unchecked()` a `panic!`, y `UncheckedSlice` de `get_unchecked` a
# indexado chequeado — o sea que el toolchain explota mal las suposiciones de UB
# que LLVM deriva de ahí. `mul_mod` necesita además bajar `opt-level` porque su
# camino pasa por un cast de puntero crudo que `debug_assertions` no desactiva.
# `opt-level = 2` vuelve a romper todo: no hay degradado suave.
#
# QUE NO ES `ruint` NI NUESTRO CÓDIGO LO PRUEBA EL CONTROL EN SP1
#
# Mismo `ruint` 1.20.0, mismos vectores, mismo código fuente: OpenVM falla
# 200/200 con el bit alto prendido y SP1 sale 0/200.
#
# EL COSTO, Y POR QUÉ ESTO NO ES CONFIGURACIÓN DE EVIDENCIA
#
# El ELF pasa de 1 677 064 a 6 929 216 bytes (4,1x). Un guest sin optimizar se
# paga en ciclos, que es la moneda del proyecto: **cualquier número de ciclos
# medido con este perfil NO es comparable con el de SP1**, y el desglose de
# OpenVM sigue sin existir (además `ere` v0.16.2 nunca puebla
# `total_num_cycles` para este backend).
#
# CÓMO SE SALE DE ACÁ
#
# Volver a `opt-level = 3`, `lto = true` y borrar `debug-assertions` en cuanto
# el arreglo upstream esté disponible, y verificar con el reproductor mínimo
# antes de dar por buena la vuelta. Mientras tanto, esto es lo que permite que
# un bloque real ejecute en el segundo backend.
opt-level = 0
lto = false
codegen-units = 1
panic = "abort"
debug-assertions = true

# LA CONFIGURACIÓN CRIPTOGRÁFICA DE ESTE BACKEND: NINGUNA, Y ES DELIBERADO
#
# No hay `[patch.crates-io]` acá. El guest de SP1 redirige `k256` y `sha2` a los
# forks que emiten la instrucción acelerada; este guest corre la criptografía de
# REFERENCIA —la misma que testean los ejes nativos— y con eso alcanza para lo
# que este binario tiene que contestar: que un bloque real ejecuta adentro de
# OpenVM y publica el mismo journal que el harness computó afuera.
#
# El camino acelerado de OpenVM no entra por un patch sino por el otro
# mecanismo: el conjunto de símbolos `extern "C"` que el backend implementa con
# sus intrínsecas. Wirearlo es una decisión con riesgo de consenso propio
# —el estándar no fija el layout de un punto de curva— y por eso va separado de
# la plomería del toolchain: son dos modos de falla independientes y depurarlos
# juntos es la receta para no saber cuál falló.
