# El guest **concreto** de SP1: la cáscara que nombra el backend.
#
# POR QUÉ ES UN CRATE HOJA Y NO UNA FEATURE DE `repo-b-guest`
#
# No hay un ELF para todos los backends. `ere-platform-sp1` reexporta `sp1_zkvm`
# y exige `sp1_zkvm::entrypoint!(main)`: el binario nombra su backend por
# construcción. Lo agnóstico es la LÓGICA, que vive entera en
# `repo_b_guest::entry` y es genérica sobre `Platform`. Cada backend es un
# archivo de tres líneas como éste.
#
# POR QUÉ NO ES MIEMBRO DEL WORKSPACE
#
# Tiene su propio `[workspace]` a propósito. Si fuera miembro, un
# `cargo build --workspace` en la máquina de desarrollo arrastraría el SDK
# entero de SP1 al grafo del motor — que es exactamente la cuarentena que este
# repo le pide a `crates/prover`. Acá el aislamiento es estructural:
# el motor no puede importar SP1 ni por accidente, porque SP1 no está en su
# grafo.
#
# Se compila SOLO con el toolchain de SP1 (adentro de su imagen de Docker, vía
# `ere`), nunca con el `cargo` del host.
[workspace]

[package]
name = "repo-b-guest-sp1"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
repo-b-guest = { path = "../guest" }
ere-platform-sp1 = { git = "https://github.com/eth-act/ere.git", tag = "v0.16.2" }

[profile.release]
# El guest se paga en ciclos, no en tiempo de compilación.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# LA CONFIGURACIÓN CRIPTOGRÁFICA DE ESTE BACKEND
#
# Un `[patch.crates-io]` redirige un crate **al mismo crate**, compilado de otra
# fuente. Acá redirige `k256` y `sha2` a los forks que mantiene SP1, cuyo único
# cambio es emitir la instrucción que le pide al circuito que resuelva la
# operación por hardware en vez de ejecutar el algoritmo instrucción por
# instrucción. Sin eso, el zkVM no acelera nada: la aceleración está atada a la
# LIBRERÍA, no al backend.
#
# POR QUÉ SOLO ESTOS DOS
#
# SP1 parchea cinco librerías. De las otras tres, ninguna está en nuestro árbol:
# keccak entra por `alloy-primitives` (`sha3` + `keccak-asm`), y las curvas de
# pairing son `ark-bn254`/`ark-bls12-381`. Cambiar de curva NO es un patch —es
# portar `precompiles.rs` a otra API, con riesgo de consenso propio— y queda
# fuera de esta fase por ser optimización.
#
# POR QUÉ ACÁ Y NO EN LA RAÍZ DEL WORKSPACE
#
# Éste es el crate del backend, fuera del workspace del motor. Si el patch
# viviera en la raíz, el motor dejaría de ser agnóstico: su grafo de
# dependencias cambiaría según qué prover se piense usar. El código fuente del
# motor es agnóstico; la configuración de build puede ser específica del
# backend, y por eso vive donde el backend se nombra.
#
# LOS TAGS SON LOS DE SP1 v6.4.0, NO UNA ELECCIÓN NUESTRA
#
# Salen de `libzkevm` v6.4.0 —el crate que el propio SP1 usa para su zkEVM— y
# entran a este grafo por `ere-platform-sp1`. Pineados por TAG, nunca por rama:
# una rama hace que el ELF dependa del día en que se compiló.
#
# QUÉ NO PRUEBA UN GATE NATIVO CON ESTO PUESTO
#
# Compiladas para la máquina de desarrollo, estas librerías caen al algoritmo
# genérico: la instrucción especial solo se emite adentro del zkVM. Correr los
# ejes en local con el patch puesto prueba que **cambiar de librería no cambió
# la semántica**, y NO prueba el camino acelerado.
#
# LA REGLA QUE ESTO OBEDECE
#
# Lo prohibido no es el patch: es el patch **sin gate**. Toda configuración
# criptográfica está enumerada en `crypto-configs.toml` con su evidencia, y
# `scripts/check-crypto-config.sh` rechaza cualquiera que no lo esté.
[patch.crates-io]
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-6.2.0" }
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha2-0.10.9-sp1-6.2.0" }
