[package]
name = "repo-b-prover"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# El journal y el techo de output: el contrato de lo que el guest publica vive
# en el crate del guest porque las dos puntas lo necesitan y esa punta es
# `no_std`. Acá se reexporta, que es donde el seam lo expone.
repo-b-guest.workspace = true
# `Spec` y `B256`, para la política de verificación (`policy`).
repo-b-common.workspace = true
# El header de bloque, para construir lo esperado desde un header de mainnet.
repo-b-block.workspace = true

# **El seam adoptado.** `ere` (eth-act) no está en crates.io: dep `git` pineada
# por TAG, habilitada explícitamente en `deny.toml`. Ver el doc de `lib.rs` para
# qué se reexporta y qué se envuelve.
ere-prover-core = { git = "https://github.com/eth-act/ere.git", tag = "v0.20.2" }
ere-compiler-core = { git = "https://github.com/eth-act/ere.git", tag = "v0.20.2" }

[dev-dependencies]
# Los tests corren en host y necesitan un provider con nombre (como en
# `crates/block`): la librería reenvía, pero sus tests también se compilan solos.
repo-b-evm = { workspace = true, features = ["crypto-reference"] }
# `Bloom` y `B64` para armar un header completo en los tests de la política.
alloy-primitives.workspace = true

[lints]
workspace = true

[features]
# Ver la nota de `crates/witness`: librería reenvía, hoja elige.
crypto-reference = ["repo-b-guest/crypto-reference"]
crypto-openvm = ["repo-b-guest/crypto-openvm"]
