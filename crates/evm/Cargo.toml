[package]
name = "repo-b-evm"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
repo-b-common.workspace = true
repo-b-interpreter.workspace = true
# Precompiles básicas (slice 2.8a, task 012): MISMOS crates que activa
# `revm-precompile` =34.0.0 (pineado en este repo) para ECRECOVER/SHA256/
# RIPEMD160 — decisión ya tomada por el research de PHASE_2_ROADMAP.md
# §Reglas del roadmap (2026-08-09), no se reinvestiga acá. `default-features
# = false`: sin "std" (no_std/RISC-V) y sin "alloc" (ninguno de los tres lo
# necesita para el subconjunto que este slice usa — verificado en el
# attempt_log del task-file).
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa"] }
sha2 = { version = "0.10.9", default-features = false }
ripemd = { version = "0.1.3", default-features = false }
# MODEXP (slice 2.8b, task 013): mismo crate que `revm-precompile` =34.0.0
# activa acá para 0x05 sin el feature `gmp` (bindings C) — bignum puro Rust,
# `no_std`-compatible (usa `extern crate alloc` internamente con
# `default-features = false`).
aurora-engine-modexp = { version = "1.2.0", default-features = false }

[features]
default = []
# Reenvía el step-tracer EIP-3155 del intérprete (task 003) para que el
# harness diferencial pueda trazar la MISMA ejecución que corre `execute_tx`,
# en vez de rearmar el frame por su cuenta (rearmarlo sería un segundo lugar
# donde el setup de consenso puede divergir). Off en el guest.
tracer = ["repo-b-interpreter/tracer"]

[lints]
workspace = true
