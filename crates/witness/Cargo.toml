[package]
name = "repo-b-witness"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
repo-b-common.workspace = true
repo-b-evm.workspace = true
# El MPT del guest. `default-features = false` lo mantiene `no_std`: verificado
# construyendo este crate al target sin floats. Es LA MISMA implementación que
# usa el harness para computar roots — no una segunda que pueda discrepar.
alloy-trie = { workspace = true }
alloy-rlp.workspace = true

[dev-dependencies]
# Los tests corren en host y necesitan un provider con nombre (como en
# `crates/block`): la librería reenvía, pero sus tests también se compilan solos.
repo-b-evm = { workspace = true, features = ["crypto-reference"] }
# El grabador es `std` (vive del lado del host) y `tests/block_path.rs` lo usa.
# Esta auto-dependencia es lo que prende `std` en `cargo test -p
# repo-b-witness`: sin ella ese test no compila, y `required-features` lo
# saltearía en silencio. El costo: en la línea de comandos,
# `--features repo-b-witness/<f>` se lee como feature de ESTA dependencia y no
# llega a la librería. Con `-p repo-b-witness` se escribe `--features <f>`.
repo-b-witness = { path = ".", features = ["std"] }

[features]
# El grabador vive del lado del host (el guest consume el witness, no lo graba),
# así que puede pagar `std`: el log necesita interior mutability compartida y el
# seam pide `&self` + `Send + Sync`. Por default el crate sigue `no_std`, que es
# lo que el `State` respaldado por witness necesita para compilar al guest.
default = []
std = []
# El provider criptográfico se REENVÍA, no se elige acá. Regla del repo: un
# crate LIBRERÍA reenvía y solo las HOJAS eligen. Fijar un provider en una
# librería lo prende para todo el que la use — y con features aditivas eso
# activa dos a la vez sin que nadie lo pida, que es justo lo que
# `crypto/mod.rs` hace imposible de compilar.
crypto-reference = ["repo-b-evm/crypto-reference"]
crypto-openvm = ["repo-b-evm/crypto-openvm"]

[lints]
workspace = true
