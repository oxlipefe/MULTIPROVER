[package]
name = "conformance"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
repo-b-evm.workspace = true
# El grabador de accesos: el harness es el host, así que activa su feature
# `std`. El crate por default sigue `no_std` (lo verifica el gate).
repo-b-witness = { workspace = true, features = ["std"] }
repo-b-common.workspace = true
# El harness codifica el input del guest y el guest lo decodifica: son dos
# implementaciones que tienen que coincidir, y el gate es correrlas juntas.
repo-b-guest.workspace = true
# **Solo el harness firma.** Un `state_test` publica `secretKey` en vez de
# `v`/`r`/`s`, así que sin un firmante ese eje no puede ejercitar la derivación
# del sender. El guest NO firma nunca: solo recupera.
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa"] }
# El fuzzer construye programas contra la tabla de opcodes DEL INTÉRPRETE (no
# una copia), así que la dependencia no es opcional; lo que sigue detrás de la
# feature es su `tracer`, que normaliza la traza EIP-3155 del bridge.
repo-b-interpreter = { workspace = true }
# Oráculo del diferencial. Opcional tras feature para no forzar el build pesado
# en Fase 0; se activa en Fase 2 (`--features diff-revm`). de zeth: pin =38.0.0.
revm = { workspace = true, optional = true }
# std acá es deliberado: el runner vive fuera del motor no_std.
alloy-primitives = { workspace = true, features = ["std"] }
alloy-rlp.workspace = true
# El harness es el host: reactiva `std` (la raíz lo declara sin default para
# que el crate del guest pueda usarlo `no_std`).
alloy-trie = { workspace = true, features = ["std"] }
serde_json.workspace = true
# EIP-7685: el `requestsHash` es un commitment SHA-256, no Keccak. Misma
# versión que ya usa el motor para la precompile `0x02`.
sha2 = { version = "0.10.9", default-features = false }

[features]
default = []
# Oráculo in-process + los dos tracers EIP-3155 del primer-paso-divergente.
diff-revm = [
    "dep:revm",
    "repo-b-interpreter/tracer",
    "repo-b-evm/tracer",
]

[lints]
workspace = true
