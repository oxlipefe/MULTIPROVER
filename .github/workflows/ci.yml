name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  # PARCHE 2 — el oráculo tiene que correr en CI.
  #
  # El bridge a `revm` vive detrás de `--features diff-revm` y hasta acá NUNCA
  # corrió en CI: los tests que lo usan y su clippy solo se ejercitaban a mano.
  # Un oráculo que nadie compila en frío es un oráculo que se pudre en silencio
  # — y es el que juzga las 327 corridas del diferencial.
  #
  # Va en job aparte porque el build de revm es pesado y no tiene por qué
  # frenar los tres jobs baratos de arriba.
  diff-revm:
    name: Diferencial vs revm (oráculo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p conformance --all-targets --features diff-revm
      - run: cargo test -p conformance --features diff-revm

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  # PARCHE 1 — el target de evidencia es el libre de floats, y el gate son los
  # SÍMBOLOS, no el build.
  #
  # `riscv64gc` trae F/D y ABI `lp64d`: compilar ahí no prueba nada sobre la
  # regla dura de `CLAUDE.md` §5. Y el hallazgo de 3.0 va más lejos: NINGÚN
  # build lo prueba, porque rustc baja un `f64` a rutinas soft-float en vez de
  # rechazarlo. Lo que el target sin F/D aporta es DETECTABILIDAD, y el gate
  # real es `scripts/check-no-floats.sh`, que hasta acá no corría en CI —
  # brecha declarada entre los documentos de piedra y lo que CI verifica.
  #
  # `riscv64gc` se conserva como build secundario de portabilidad, sin rol de
  # evidencia.
  no-std:
    name: no_std + sin floats (target del guest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          targets: riscv64imac-unknown-none-elf, riscv64gc-unknown-none-elf
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
      # El gate real: el motor no referencia ninguna rutina de punto flotante,
      # y el ELF del guest tampoco CONTIENE una. Son dos predicados distintos:
      # sobre un binario estático `--undefined-only` es ciego, porque
      # `compiler_builtins` ya se linkeó adentro. Construye el target sin F/D y
      # el ELF por dentro.
      - run: bash scripts/check-no-floats.sh
      # La única excepción de `unsafe` del repo (el arranque bare-metal) no
      # puede crecer sin que alguien lo firme, y ningún crate puede dejar de
      # heredar el `forbid` del workspace.
      - run: bash scripts/check-unsafe.sh
      # PARCHE 5 (slice 4.0) - la ISA que el ELF declara. Regla distinta de la
      # de floats y por eso archivo distinto: el estandar de zkVM de `eth-act`
      # excluye la extension C, y un ELF con instrucciones comprimidas no corre
      # mas lento en un backend de proving, es RECHAZADO. Sin este chequeo eso
      # se descubre al integrar el primer backend, no aca.
      #
      # No hace falta declarar el nightly aca: `scripts/guest-build.sh` lo pinea
      # y lo instala solo. Ponerlo tambien en este archivo duplicaria la fecha
      # en dos lugares sin nada que los ate.
      - run: bash scripts/check-guest-isa.sh
      # Build secundario de portabilidad. No es evidencia de nada sobre floats.
      # El provider criptográfico se NOMBRA: el seam dejó de tener uno por
      # default, así que un build que no lo elige no compila —a propósito—.
      - run: cargo build --features repo-b-evm/crypto-reference -p repo-b-common -p repo-b-evm -p repo-b-interpreter --target riscv64gc-unknown-none-elf

  # PARCHE 3 — los gates del witness son baratos y no estaban.
  #
  # `--record-replay` y `--witness` corren sobre el subset vendoreado (327
  # fixtures, décimas de segundo) y son el DoD de 3.1 y 3.2a. Los ejes de EEST
  # NO entran acá: exigen bajar 257 MB, y su trinquete es una corrida aparte.
  #
  # El comentario viejo decía que el gate global de Fase 2 seguía en RED. Ya no:
  # los dos ejes de EEST están en 39 025/39 025 y 42 017/42 017.
  conformance-gate:
    name: Conformance (subset vendoreado + gates de witness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@v2
      # Desde Fase 1 el subset vendoreado DEBE pasar (exit 0): una regresión
      # rompe CI.
      - run: cargo run -p conformance
      # El log de accesos es transparente, suficiente y mínimo.
      - run: cargo run -p conformance -- --record-replay
      # Los casos ejecutan solo desde el witness, con cada lectura verificada
      # contra el pre-state root. Los diferidos se declaran adentro.
      - run: cargo run -p conformance -- --witness

  # PARCHE 6 (slice 4.2a) — la cuarentena la verifica CI, y el chequeo viejo
  # miraba lo que no es.
  #
  # La regla escrita exige que el motor no importe ningún backend, verificado
  # por CI. Pero un backend no entra importando: entra por `[patch.crates-io]`,
  # que es **invisible a cualquier chequeo de imports**. Este slice introduce el
  # primer patch del repo, o sea que es el primero que puede violar la regla —
  # y el gate tiene que existir JUNTO con el patch, no después.
  #
  # `scripts/check-crypto-config.sh` es barato (lee manifiestos, no compila
  # nada) y por eso va con los gates rápidos y no en un job propio.
  crypto-config:
    name: Cuarentena criptográfica (configuración enumerada + evidencia)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-crypto-config.sh

  # El seam criptográfico: que la criptografía del motor
  # pase por `Crypto` y por ningún otro lado. Es OTRA regla que la cuarentena de
  # arriba —aquélla mira configuraciones aceleradas y su evidencia, ésta mira
  # que no haya un camino que las esquive— y por eso es su propio script.
  #
  # Va acá y no en un `run` del job anterior para que un rojo diga cuál de las
  # dos reglas se rompió sin tener que leer el log.
  crypto-seam:
    name: Seam criptográfico (un solo camino, y sin métodos muertos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-crypto-seam.sh

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # PARCHE 4 — el job de audit venía ROJO desde ~15 commits, y no por un
  # advisory.
  #
  # `rustsec/audit-check@v2` instala `cargo-audit` con `cargo install` SIN
  # `--locked`, así que lo compila con la toolchain del repo. La última versión
  # arrastra `kstring 2.0.4`, que exige **rustc 1.96.0**, y este repo está
  # pineado en **1.92.0** (alineado a zeth). Resultado: el job muere ANTES de
  # mirar un solo advisory — el log ni siquiera llega a nombrar uno.
  #
  # Dos consecuencias, y la segunda es la que importa:
  #   1. Compilar la herramienta con la toolchain del proyecto ata la MSRV del
  #      repo a la de una dependencia ajena. Se instala un binario
  #      PRECOMPILADO, que no compila nada y no tiene MSRV.
  #   2. El action nunca llegaba a leer `.cargo/audit.toml`, donde vive el
  #      ignore **documentado** de `RUSTSEC-2025-0055`. Corriendo `cargo audit`
  #      como paso normal, la configuración del repo se respeta — que es lo que
  #      hace que este job diga algo en vez de repetir un ruido conocido.
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
      - uses: taiki-e/install-action@cargo-audit
      # Sin `--file`: `cargo audit` lee `.cargo/audit.toml` del repo solo.
      - run: cargo audit
