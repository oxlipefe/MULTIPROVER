[package]
name = "repo-b-witness"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
repo-b-common.workspace = true
repo-b-evm.workspace = true
# El MPT del guest. `default-features = false` lo mantiene `no_std`: verificado
# construyendo este crate al target sin floats. Es LA MISMA implementación que
# usa el harness para computar roots — no una segunda que pueda discrepar.
alloy-trie = { workspace = true, default-features = false }
alloy-rlp.workspace = true

[features]
# El grabador vive del lado del host (el guest consume el witness, no lo graba),
# así que puede pagar `std`: el log necesita interior mutability compartida y el
# seam pide `&self` + `Send + Sync`. Por default el crate sigue `no_std`, que es
# lo que el `State` respaldado por witness necesita para compilar al guest.
default = []
std = []

[lints]
workspace = true
